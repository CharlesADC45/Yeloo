global:
  scrape_interval: 15s

scrape_configs:
  - job_name: yeloo-api-local
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000

  - job_name: yeloo-api-render
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets:
          - yeloo-api.onrender.com
